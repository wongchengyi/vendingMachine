<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かわいい自動販売機</title>
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(to bottom, #f0e5e5, #d9f7f7);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .vending-machine {
            width: 300px;
            height: 500px;
            background: linear-gradient(145deg, #f9f9f9, #e0e0e0);
            border-radius: 20px;
            box-shadow: 10px 10px 20px #d1d1d1, -10px -10px 20px #ffffff;
            position: relative;
            margin: 50px auto;
            padding: 20px;
        }
        .vending-machine h1 {
            text-align: center;
            color: #5c4d8a;
            margin: 0;
            font-size: 24px;
        }
        .drink-slot {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .drink {
            background: #fff;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .drink:hover {
            transform: scale(1.05);
        }
        .price {
            font-size: 18px;
            color: #5c4d8a;
        }
        .button {
            background: #ffcc00;
            border: none;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 5px;
        }
        .button:hover {
            background: #ffb300;
        }
        .display {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin: 10px 0;
        }
        .pickup-flap {
            width: 100%;
            height: 50px;
            background: #ffcc00;
            border-radius: 10px;
            position: absolute;
            bottom: 20px;
            left: 0;
            text-align: center;
            line-height: 50px;
            display: none;
        }
        .cat-mascot {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffcc00"><circle cx="12" cy="12" r="10"/><path fill="%23fff" d="M12 16c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/></svg>') no-repeat center;
            background-size: contain;
        }
    </style>
</head>
<body>
    <div class="vending-machine">
        <h1>かわいい自動販売機</h1>
        <div class="display" id="display">残高: ¥0</div>
        <div class="drink-slot">
            <div class="drink" data-price="130" onclick="selectDrink(this)">
                <div>ラムネ</div>
                <div class="price">¥130</div>
            </div>
            <div class="drink" data-price="150" onclick="selectDrink(this)">
                <div>抹茶ラテ</div>
                <div class="price">¥150</div>
            </div>
            <div class="drink" data-price="180" onclick="selectDrink(this)">
                <div>メロンソーダ</div>
                <div class="price">¥180</div>
            </div>
            <div class="drink" data-price="130" onclick="selectDrink(this)">
                <div>ピーチティー</div>
                <div class="price">¥130</div>
            </div>
            <div class="drink" data-price="150" onclick="selectDrink(this)">
                <div>缶コーヒー</div>
                <div class="price">¥150</div>
            </div>
            <div class="drink" data-price="180" onclick="selectDrink(this)">
                <div>いちごミルク</div>
                <div class="price">¥180</div>
            </div>
        </div>
        <button class="button" onclick="insertCoin(10)">¥10</button>
        <button class="button" onclick="insertCoin(50)">¥50</button>
        <button class="button" onclick="insertCoin(100)">¥100</button>
        <button class="button" onclick="insertCoin(500)">¥500</button>
        <div class="pickup-flap" id="pickupFlap">おつり</div>
        <div class="cat-mascot" id="catMascot"></div>
    </div>
    <script>
        let balance = 0;

        function insertCoin(value) {
            balance += value;
            document.getElementById('display').innerText = `残高: ¥${balance}`;
        }

        function selectDrink(drink) {
            const price = parseInt(drink.getAttribute('data-price'));
            if (balance >= price) {
                balance -= price;
                document.getElementById('display').innerText = `残高: ¥${balance}`;
                document.getElementById('pickupFlap').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('pickupFlap').style.display = 'none';
                }, 2000);
                // Play sound
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
                oscillator.connect(audioContext.destination);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.1);
            } else {
                shakeMachine();
            }
        }

        function shakeMachine() {
            const machine = document.querySelector('.vending-machine');
            machine.style.animation = 'shake 0.5s';
            setTimeout(() => {
                machine.style.animation = '';
            }, 500);
            alert('お金が足りません');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const cat = document.getElementById('catMascot');
            cat.style.animation = 'wave 1s infinite';
        });
    </script>
</body>
</html>
